<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Discerny</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
body{margin:0;font:14px/1.45 -apple-system,Segoe UI,Roboto,Arial,sans-serif;background:#f6f7f9;color:#1d2330}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #dfe3ea;padding:12px 20px}
h1{font-size:18px;margin:0 0 2px;display:flex;gap:10px;align-items:center}
.sub{color:#5b6475;font-size:12px}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
.seg{display:inline-flex;border:1px solid #c9cfda;border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;padding:6px 12px;cursor:pointer;font:inherit;color:#37405a}
.seg button.on{background:#1f4fd8;color:#fff}
input[type=search],input[type=text],input[type=date],select,textarea{font:inherit;border:1px solid #c9cfda;border-radius:6px;padding:5px 8px;background:#fff}
input[type=search]{width:200px}
label.chk{font-size:13px;color:#37405a;display:flex;gap:5px;align-items:center}
.btn{border:1px solid #c9cfda;background:#fff;border-radius:6px;padding:5px 10px;cursor:pointer;font:inherit}
.btn.p{background:#1f4fd8;color:#fff;border-color:#1f4fd8}
.stats{display:flex;gap:14px;margin-left:auto;font-size:12px;color:#5b6475}
.stats b{color:#1d2330}
#sync{font-size:11px;font-weight:400;color:#1c7a3e;background:#e5f5ea;border-radius:10px;padding:1px 9px}
#sync.err{color:#b0231f;background:#fde4e3}
main{padding:16px 20px 60px;max-width:1100px;margin:0 auto}
.grp{margin-bottom:22px}
.grp h2{font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:#37405a;margin:0 0 8px;display:flex;gap:8px;align-items:center}
.grp h2 .n{background:#e3e8f3;border-radius:10px;padding:0 8px;font-size:11px}
.item{background:#fff;border:1px solid #e1e5ec;border-left:4px solid #c9cfda;border-radius:8px;padding:8px 12px;margin-bottom:6px}
.item.u-today{border-left-color:#d6332f}.item.u-week{border-left-color:#e28a1b}.item.u-soon{border-left-color:#2f7fd6}.item.u-later{border-left-color:#8a93a6}.item.u-fyi{border-left-color:#c9cfda}
.item.done{opacity:.55}.item.done .t{text-decoration:line-through}
.row{display:flex;gap:10px;align-items:flex-start}
.row input[type=checkbox]{margin-top:3px;width:16px;height:16px}
.t{font-weight:600;flex:1;cursor:pointer}
.id{font:11px Consolas,monospace;background:#eef1f6;border:0;border-radius:5px;padding:2px 6px;color:#37405a;cursor:pointer;display:inline-flex;gap:4px;align-items:center;white-space:nowrap;margin-top:1px}
.id:hover{background:#dfe6f6}.id.ok{background:#e5f5ea;color:#1c7a3e}
.id svg{width:11px;height:11px}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:4px 0 0 26px}
.chip{font-size:11px;border-radius:10px;padding:1px 8px;background:#eef1f6;color:#37405a}
.chip.type{background:#e6eaff;color:#1f4fd8}.chip.today{background:#fde4e3;color:#b0231f}.chip.week{background:#fdeed6;color:#9a5a05}
.chip.hi{background:#fde4e3;color:#b0231f}.chip.st{background:#e5f5ea;color:#1c7a3e}.chip.due{background:#fff3c4;color:#7a5b00}
.det{display:none;margin:8px 0 2px 26px;font-size:13px}
.item.open .det{display:block}
.det .src{color:#5b6475;margin-bottom:6px}
.det .note{margin:4px 0}
.det textarea{width:100%;min-height:54px;margin-top:6px}
.det .ctl{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;align-items:center}
.det a{color:#1f4fd8;margin-right:10px}
.sub-i{display:flex;gap:6px;align-items:center;margin:2px 0}
.sub-i.x span{text-decoration:line-through;color:#8a93a6}
.add{background:#fff;border:1px dashed #9aa5bd;border-radius:8px;padding:10px;margin:0 0 18px;display:none;gap:8px;flex-wrap:wrap}
.add.show{display:flex}.add input[type=text]{flex:1;min-width:260px}
.empty{color:#8a93a6;font-style:italic}
#gate{max-width:560px;margin:80px auto;text-align:center;display:none}
#gate .btn{padding:10px 18px;font-size:15px}
#msg{color:#b0231f;margin-top:12px;font-size:13px}
.chip.miss{background:#fde4e3;color:#b0231f}
.pin{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}
.pin input{width:190px}
.sub2{font-size:12px;font-weight:600;color:#5b6475;margin:10px 0 6px}
.hist{font-size:12px;color:#5b6475;margin:2px 0}
.chip.blk{background:#fde4e3;color:#b0231f}.chip.ok{background:#e5f5ea;color:#1c7a3e}
.deps{display:flex;flex-wrap:wrap;gap:5px;align-items:center;margin:6px 0}
.deps .dl{font-size:12px;font-weight:600;color:#5b6475}
.deps input{width:230px}
.xbtn{border:0;background:none;cursor:pointer;margin-left:4px;color:inherit;font:inherit;padding:0}
.btn.ask{margin-left:auto;white-space:nowrap;padding:2px 9px;font-size:12px}
.btn.ask.has{border-color:#1f4fd8;color:#1f4fd8}
.badge{background:#1f4fd8;color:#fff;border-radius:9px;padding:0 6px;font-size:11px;margin-left:4px}
.item.asking{outline:2px solid #1f4fd8}
body.ask-open #app{margin-right:380px}
#askPane{position:fixed;top:0;right:0;bottom:0;width:380px;background:#fff;border-left:1px solid #dfe3ea;box-shadow:-4px 0 12px rgba(0,0,0,.06);z-index:20;display:none;flex-direction:column;padding:12px 14px;gap:8px;overflow:hidden}
#askPane .ah{display:flex;gap:8px;align-items:flex-start}
#askTitle{flex:1;font-weight:600;display:flex;gap:6px;align-items:flex-start;flex-wrap:wrap}
.actx{display:flex;flex-wrap:wrap;gap:5px}
.alist{flex:1;overflow:auto;display:flex;flex-direction:column;gap:6px}
.an{border:1px solid #e1e5ec;border-radius:8px;padding:6px 8px;background:#fafbfd}
.an.click{cursor:pointer}.an.click:hover{background:#eef3ff}
.ats{font-size:11px;color:#5b6475}
.atx{white-space:pre-wrap;word-break:break-word;font-size:13px}
.atx.sm{font-size:12px;color:#37405a}
.aact{display:flex;gap:6px;margin-top:4px}.aact .btn{padding:1px 8px;font-size:12px}
.an textarea{width:100%;min-height:60px}
#askNew textarea{width:100%;min-height:90px}
.arow{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.hint{font-size:12px;color:#5b6475}
.chip.click{cursor:pointer}.chip.click:hover{filter:brightness(.94)}
.chip.prj{background:#e3f4f0;color:#0f6b5c}.chip.tag{background:#f1ebfa;color:#5a2fa0}
.chips.trow{margin-top:4px}
.lnk{display:inline-flex;align-items:center;gap:2px;margin-right:10px}
.picker{display:flex;flex-direction:column;gap:4px;flex:1;min-width:230px}.pchips{display:flex;flex-wrap:wrap;gap:4px}
#addForm.show{flex-direction:column;align-items:stretch}
#addForm input[type=text],#addForm textarea{flex:none}
#addForm .wide{width:100%;min-width:0}
#addForm textarea{min-height:66px;resize:vertical}
#addForm .arow2{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-start}
#addForm .picker input{width:100%;min-width:0}
</style></head><body>
<div id="gate">
  <h2>Discerny</h2>
  <p id="gateTxt">Connect the Discerny folder that holds TASKS.md. Your browser will ask once for permission.</p>
  <button class="btn p" id="connect">Connect folder</button>

</div>
<div id="dls"></div>
<div id="app" style="display:none">
<header>
  <h1>Discerny <span id="sync">synced</span> <button class="btn" id="askAll" style="font-size:12px;font-weight:400" title="Show every queued Ask agent note">0 asks queued</button>
  <span class="seg" id="pages" style="margin-left:8px;font-size:14px;font-weight:400"><button data-p="tasks" class="on">Tasks</button><button data-p="people">People</button><button data-p="projects">Projects</button><button data-p="systems">Systems</button></span></h1>

    </div>

  <div id="peoplePane" style="display:none">
    <div class="add" id="addPForm">

  </div>

  </div>
</main>
<aside id="askPane">
  <div class="ah"><div id="askTitle"></div><button class="btn" id="askClose" title="Close">×</button></div>

    <textarea id="askText" placeholder="Note or request for the agent – a correction, a question, 'split this up', 'draft a reply', 'depends on T-00xx'…"></textarea>
    <div class="arow"><span class="hint">Ctrl+Enter to queue</span><button class="btn p" id="askAdd">Queue note</button></div>
  </div>
</aside>
</div>
<script>
//<core>
var URG={today:'Today',week:'This week',soon:'Next 2 weeks',later:'Later',fyi:'FYI / awareness'};
var URG_ORDER=['today','week','soon','later','fyi'];
var TYPES=['Task','Meeting','Process','Document','FYI'];
var TYPE_LABEL={Task:'Tasks',Meeting:'Meetings',Process:'Processes & SOPs',Document:'Documents to read',FYI:'FYI / awareness'};
var STATUS=['To do','In progress','Waiting'];
var ITEM_RE=/^- \[( |x)\] (T-\d+) (.*)$/;
function parseMeta(s){var m={};s.split(';').forEach(function(p){var i=p.indexOf(':');if(i>0)m[p.slice(0,i).trim()]=p.slice(i+1).trim();});return m;}
function parse(text){
  var lines=String(text||'').replace(/\r/g,'').split('\n');var pre=[],items=[],cur=null;
  if(lines.length&&lines[lines.length-1]==='')lines.pop();
  lines.forEach(function(ln){
    var m=ITEM_RE.exec(ln);
    if(m){var rest=m[3],meta={},bi=rest.lastIndexOf(' {');
      if(bi>-1&&rest.charAt(rest.length-1)==='}'){meta=parseMeta(rest.slice(bi+2,-1));rest=rest.slice(0,bi);}
      cur={id:m[2],done:m[1]==='x',title:rest,meta:meta,subs:[]};items.push(cur);return;}
    if(!cur){pre.push(ln);return;}
    var s=/^  - (src|note|link|my|ref): ?(.*)$/.exec(ln);
    if(s){cur.subs.push({k:s[1],v:s[2]});return;}
    var c=/^  - \[( |x)\] (.*)$/.exec(ln);
    if(c){cur.subs.push({k:'sub',v:c[2],x:c[1]==='x'});return;}
    cur.subs.push({k:'raw',v:ln});
  });
  return {pre:pre,items:items};}
var META_ORDER=['ty','who','prj','tg','top','urg','p','due','st','dep','done','asg'];
function serItem(it){
  var parts=[];META_ORDER.forEach(function(k){if(it.meta[k]!==undefined&&it.meta[k]!=='')parts.push(k+':'+String(it.meta[k]).replace(/;/g,','));});
  Object.keys(it.meta).forEach(function(k){if(META_ORDER.indexOf(k)<0&&it.meta[k]!=='')parts.push(k+':'+String(it.meta[k]).replace(/;/g,','));});
  var s='- ['+(it.done?'x':' ')+'] '+it.id+' '+it.title+(parts.length?' {'+parts.join('; ')+'}':'');
  it.subs.forEach(function(b){
    if(b.k==='raw')s+='\n'+b.v;
    else if(b.k==='sub')s+='\n  - ['+(b.x?'x':' ')+'] '+b.v;
    else s+='\n  - '+b.k+': '+b.v;});
  return s;}
function serialize(model){return model.pre.join('\n')+'\n'+model.items.map(serItem).join('\n')+(model.items.length?'\n':'');}
function nextId(model){var n=0;model.pre.forEach(function(l){var m=/next-id:\s*(\d+)/.exec(l);if(m)n=parseInt(m[1],10);});
  model.items.forEach(function(i){var k=parseInt(i.id.slice(2),10);if(k>=n)n=k+1;});return n;}
function setNextId(model,n){var f=false;model.pre=model.pre.map(function(l){if(/next-id:/.test(l)){f=true;return '<!-- next-id: '+n+' -->';}return l;});
  if(!f)model.pre.push('<!-- next-id: '+n+' -->');}
function fmtId(n){return 'T-'+('0000'+n).slice(-4);}
function getSub(it,k){return it.subs.filter(function(b){return b.k===k;});}
// ---- people (PEOPLE.md): "## Group" headings, "- Name {co:; dept:; title:; mgr:; st:Left; chk:date}" + "  - note:/hist:" lines
var PFIELDS=['co','dept','title','mgr'];
var PLABEL={co:'Company',dept:'Department',title:'Job title',mgr:'Reports to',grp:'Group'};
var PMETA_ORDER=['id','co','dept','title','mgr','ext','st','chk'];
function pParse(text){
  var lines=String(text||'').replace(/\r/g,'').split('\n');var pre=[],people=[],cur=null,grp='Other',started=false;
  lines.forEach(function(ln){
    var h=/^## (.*)$/.exec(ln);
    if(h){grp=h[1].trim()||'Other';started=true;cur=null;return;}
    var m=/^- (.+)$/.exec(ln);
    if(m){started=true;var rest=m[1],meta={},bi=rest.lastIndexOf(' {');
      if(bi>-1&&rest.charAt(rest.length-1)==='}'){meta=parseMeta(rest.slice(bi+2,-1));rest=rest.slice(0,bi);}
      cur={name:rest.trim(),grp:grp,meta:meta,subs:[]};people.push(cur);return;}
    if(!started){pre.push(ln);return;}
    if(!cur||ln.trim()==='')return;
    var s=/^  - (note|hist): ?(.*)$/.exec(ln);
    if(s){cur.subs.push({k:s[1],v:s[2]});return;}
    cur.subs.push({k:'raw',v:ln});});
  while(pre.length&&pre[pre.length-1].trim()==='')pre.pop();
  return {pre:pre,people:people};}
function pSerItem(p){
  var parts=[];PMETA_ORDER.forEach(function(k){if(p.meta[k]!==undefined&&p.meta[k]!=='')parts.push(k+':'+String(p.meta[k]).replace(/;/g,','));});
  Object.keys(p.meta).forEach(function(k){if(PMETA_ORDER.indexOf(k)<0&&p.meta[k]!=='')parts.push(k+':'+String(p.meta[k]).replace(/;/g,','));});
  var s='- '+p.name+(parts.length?' {'+parts.join('; ')+'}':'');
  p.subs.forEach(function(b){s+=(b.k==='raw')?'\n'+b.v:'\n  - '+b.k+': '+b.v;});
  return s;}
function pSerialize(model){
  var order=[];model.people.forEach(function(p){var g=p.grp||'Other';if(order.indexOf(g)<0)order.push(g);});
  var out=model.pre.slice();
  order.forEach(function(g){out.push('');out.push('## '+g);model.people.forEach(function(p){if((p.grp||'Other')===g)out.push(pSerItem(p));});});
  return out.join('\n')+'\n';}
function pMissing(p){return PFIELDS.filter(function(k){return !p.meta[k];});}
// person IDs (P-####, permanent, never reused; counter lives in a next-id comment in PEOPLE.md)
function fmtPId(n){return 'P-'+('0000'+n).slice(-4);}
function pNextId(model){var n=0;model.pre.forEach(function(l){var m=/next-id:\s*(\d+)/.exec(l);if(m)n=parseInt(m[1],10);});
  model.people.forEach(function(p){var m=/^P-(\d+)$/.exec(p.meta.id||'');if(m&&parseInt(m[1],10)>=n)n=parseInt(m[1],10)+1;});return n;}
function pSetNextId(model,n){var f=false;model.pre=model.pre.map(function(l){if(/next-id:/.test(l)){f=true;return '<!-- next-id: '+n+' -->';}return l;});
  if(!f)model.pre.push('<!-- next-id: '+n+' -->');}
function ensurePIds(model){var n=pNextId(model),c=0;
  model.people.forEach(function(p){if(!/^P-\d+$/.test(p.meta.id||'')){p.meta.id=fmtPId(n++);c++;}});
  if(c||!model.pre.some(function(l){return /next-id:/.test(l);}))pSetNextId(model,n);return c;}
// task dependencies: dep:T-0012,T-0015 means "blocked by"
function depList(i){return String(i.meta.dep||'').split(/[ ,]+/).filter(Boolean);}
// ask-agent queue (ASK-AGENT.md): one line per note "- T-0012 | 2026-10-06 14:32 | text" (newlines stored as " ⏎ ")
var NOTE_RE=/^- ((?:T|P|PRJ|SYS)-\d+) \| (\d{4}-\d{2}-\d{2}(?: \d{2}:\d{2})?) \| (.*)$/;
function aParse(text){var lines=String(text||'').replace(/\r/g,'').split('\n');if(lines.length&&lines[lines.length-1]==='')lines.pop();
  var notes=[];lines.forEach(function(ln){var m=NOTE_RE.exec(ln);if(m)notes.push({id:m[1],ts:m[2],text:m[3].split(' ⏎ ').join('\n'),raw:ln});});
  return {lines:lines,notes:notes};}
function aLine(id,ts,text){return '- '+id+' | '+ts+' | '+String(text).replace(/\r/g,'').split('\n').map(function(s){return s.trim();}).filter(Boolean).join(' ⏎ ');}
// ---- tags / projects / systems / relationships (PROJECTS.md, SYSTEMS.md, RELATIONSHIPS.md)
function csv(s){return String(s||'').split(',').map(function(x){return x.trim();}).filter(Boolean);}
function tagsOf(i){var t=csv(i.meta.tg);if(!t.length&&!i.meta.prj&&i.meta.top)t=[i.meta.top];return t;}
function prjOf(i){return csv(i.meta.prj);}
function cleanTag(s){return String(s||'').replace(/[;,{}]/g,' ').replace(/\s+/g,' ').trim();}
var EMETA_ORDER=['id','type','owner','parent','part-of','st'];
function eParse(text){
  var lines=String(text||'').replace(/\r/g,'').split('\n');var pre=[],ents=[],cur=null,grp='',started=false;
  lines.forEach(function(ln){
    var h=/^## (.*)$/.exec(ln);
    if(h){grp=h[1].trim();started=true;cur=null;return;}
    var m=/^- (.+)$/.exec(ln);
    if(m){started=true;var rest=m[1],meta={},bi=rest.lastIndexOf(' {');
      if(bi>-1&&rest.charAt(rest.length-1)==='}'){meta=parseMeta(rest.slice(bi+2,-1));rest=rest.slice(0,bi);}
      cur={name:rest.trim(),grp:grp,meta:meta,subs:[]};ents.push(cur);return;}
    if(!started){pre.push(ln);return;}
    if(!cur||ln.trim()==='')return;
    var s=/^  - (note|link|my): ?(.*)$/.exec(ln);
    if(s){cur.subs.push({k:s[1],v:s[2]});return;}
    cur.subs.push({k:'raw',v:ln});});
  while(pre.length&&pre[pre.length-1].trim()==='')pre.pop();
  return {pre:pre,ents:ents};}
function eSerItem(e){
  var parts=[];EMETA_ORDER.forEach(function(k){if(e.meta[k]!==undefined&&e.meta[k]!=='')parts.push(k+':'+String(e.meta[k]).replace(/;/g,','));});
  Object.keys(e.meta).forEach(function(k){if(EMETA_ORDER.indexOf(k)<0&&e.meta[k]!=='')parts.push(k+':'+String(e.meta[k]).replace(/;/g,','));});
  var s='- '+e.name+(parts.length?' {'+parts.join('; ')+'}':'');
  e.subs.forEach(function(b){s+=(b.k==='raw')?'\n'+b.v:'\n  - '+b.k+': '+b.v;});
  return s;}
function eSerialize(model){
  var order=[];model.ents.forEach(function(e){var g=e.grp||'';if(order.indexOf(g)<0)order.push(g);});
  var out=model.pre.slice();
  order.forEach(function(g){out.push('');if(g)out.push('## '+g);model.ents.forEach(function(e){if((e.grp||'')===g)out.push(eSerItem(e));});});
  return out.join('\n')+'\n';}
function fmtEId(kind,n){return kind+'-'+('0000'+n).slice(-4);}
function eNextId(model,kind){var n=0,re=new RegExp('^'+kind+'-(\\d+)$');
  model.pre.forEach(function(l){var m=/next-id:\s*(\d+)/.exec(l);if(m)n=parseInt(m[1],10);});
  model.ents.forEach(function(e){var m=re.exec(e.meta.id||'');if(m&&parseInt(m[1],10)>=n)n=parseInt(m[1],10)+1;});return n||1;}
function eSetNextId(model,n){var f=false;model.pre=model.pre.map(function(l){if(/next-id:/.test(l)){f=true;return '<!-- next-id: '+n+' -->';}return l;});
  if(!f)model.pre.push('<!-- next-id: '+n+' -->');}
function ensureEIds(model,kind){var n=eNextId(model,kind),c=0,re=new RegExp('^'+kind+'-\\d+$');
  model.ents.forEach(function(e){if(!re.test(e.meta.id||'')){e.meta.id=fmtEId(kind,n++);c++;}});
  if(c)eSetNextId(model,n);return c;}
// relationships: "- T-0007 ~ T-0032 | related" (symmetric, stored once) or "- T-0014 -> SYS-0002 | concerns"
var REL_RE=/^- ((?:T|P|PRJ|SYS)-\d+) (~|->) ((?:T|P|PRJ|SYS)-\d+) \| (.+)$/;
function rParse(text){var lines=String(text||'').replace(/\r/g,'').split('\n');if(lines.length&&lines[lines.length-1]==='')lines.pop();
  var rels=[];lines.forEach(function(ln){var m=REL_RE.exec(ln);if(m)rels.push({a:m[1],op:m[2],b:m[3],type:m[4].trim(),raw:ln});});
  return {lines:lines,rels:rels};}
function kindOf(id){return String(id).split('-')[0];}
var REL_PAIRS={'T|SYS':'concerns','T|P':'involves','P|SYS':'owns','PRJ|SYS':'uses'};
function relLine(a,b){
  if(a===b)return {err:'An item cannot be linked to itself.'};
  var ka=kindOf(a),kb=kindOf(b);
  if(ka===kb&&ka!=='PRJ'){var s=[a,b].sort();return {line:'- '+s[0]+' ~ '+s[1]+' | related'};}
  var k1=ka+'|'+kb,k2=kb+'|'+ka;
  if(REL_PAIRS[k1])return {line:'- '+a+' -> '+b+' | '+REL_PAIRS[k1]};
  if(REL_PAIRS[k2])return {line:'- '+b+' -> '+a+' | '+REL_PAIRS[k2]};
  return {err:'Cannot link '+ka+' to '+kb+' (projects are linked to tasks with the Project field).'};}

function setPage(p){page=p;
  [].forEach.call($('pages').children,function(b){b.className=b.getAttribute('data-p')===p?'on':'';});
  var map={tasks:['taskBar','tasksPane'],people:['peopleBar','peoplePane'],projects:['projBar','projPane'],systems:['sysBar','sysPane']};
  Object.keys(map).forEach(function(k){var on=k===p;$(map[k][0]).style.display=on?'flex':'none';$(map[k][1]).style.display=on?'block':'none';});
  $('subline').textContent={tasks:'TASKS.md is the source of truth – every change is saved straight back to the file.',people:'PEOPLE.md is the source of truth – fill in company, department, title and manager; edits are saved straight back to the file.',projects:'PROJECTS.md is the source of truth – projects, workstreams and pods; tasks join them with the Project field.',systems:'SYSTEMS.md is the source of truth – the systems and platforms you work with; link them to tasks, people and projects.'}[p];
  try{localStorage.setItem('discerny-page',p);}catch(e){}
  render();}

// ------------- startup -------------
async function start(){
  $('gate').style.display='none';$('app').style.display='block';
  TYPES.forEach(function(t){var o=el('option','',t);o.value=t;$('aType').appendChild(o);});
  URG_ORDER.forEach(function(u){var o=el('option','',URG[u]);o.value=u;$('aUrg').appendChild(o);});
  $('aUrg').value='week';
  EDEF.PRJ.types.forEach(function(t){var o=el('option','',t);o.value=t;$('jType').appendChild(o);});EDEF.SYS.types.forEach(function(t){var o=el('option','',t);o.value=t;$('sType').appendChild(o);});
  initAddForm();
  await safe(reload);
  try{var sp=localStorage.getItem('discerny-page');if(['people','projects','systems'].indexOf(sp)>=0)setPage(sp);}catch(e){}
  setInterval(poll,3000);window.addEventListener('focus',poll);}
async function poll(){
  if(busy||!dir)return;var a=document.activeElement;if(a&&(a.tagName==='TEXTAREA'||(a.tagName==='INPUT'&&a.type==='text'&&a.id!=='q'&&a.id!=='pq')))return;
  try{var changed=false;var names=['TASKS.md','INBOX.md','PEOPLE.md','ASK-AGENT.md','PROJECTS.md','SYSTEMS.md','RELATIONSHIPS.md'].concat($('showDone').checked?['DONE.md']:[]);
    for(var k=0;k<names.length;k++){var m=await modOf(names[k]);if(m&&m!==lastMod[names[k]])changed=true;}
    if(changed)await safe(reload);}catch(e){setSync(false,'cannot read folder');}}
function showGate(txt,btn){$('gate').style.display='block';$('gateTxt').textContent=txt;$('connect').textContent=btn;}
$('connect').onclick=async function(){
  try{
    if(dir){var p=await dir.requestPermission({mode:'readwrite'});if(p!=='granted'){$('msg').textContent='Permission not granted.';return;}}
    else{dir=await window.showDirectoryPicker({mode:'readwrite',id:'discerny'});await idbSet('dir',dir);}
    var h=null;try{h=await dir.getFileHandle('TASKS.md');}catch(e){$('msg').textContent='No TASKS.md in "'+dir.name+'" – pick the Discerny folder.';dir=null;return;}
    await start();
  }catch(e){$('msg').textContent=e.name+': '+e.message;}};
$('views').onclick=function(e){var v=e.target.getAttribute('data-v');if(!v)return;view=v;[].forEach.call($('views').children,function(b){b.className=b.getAttribute('data-v')===v?'on':'';});render();};
$('q').oninput=render;$('tsort').onchange=render;
$('pages').onclick=function(e){var p=e.target.getAttribute('data-p');if(p)setPage(p);};
$('pviews').onclick=function(e){var v=e.target.getAttribute('data-v');if(!v)return;pview=v;[].forEach.call($('pviews').children,function(b){b.className=b.getAttribute('data-v')===v?'on':'';});renderPeople();};
$('pq').oninput=renderPeople;
$('showLeft').onchange=renderPeople;
$('addPBtn').onclick=function(){$('addPForm').classList.toggle('show');};
$('pSave').onclick=function(){var n=$('pName').value.trim();if(!n)return;addPerson(n,$('pGrp').value.trim()||'Other');$('pName').value='';};
$('showDone').onchange=function(){safe(reload);};
$('askAll').onclick=openAskAll;$('askClose').onclick=closeAsk;$('askAdd').onclick=submitAsk;
$('askText').onkeydown=function(e){if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();submitAsk();}};
$('addBtn').onclick=function(){$('addForm').classList.toggle('show');};
$('aSave').onclick=function(){var t=$('aTitle').value.trim();if(!t){$('aTitle').focus();return;}
  var tg=tagPick.get().map(function(x){return x.key;}),pj=prjPick.get();
  addItem({title:t,ty:$('aType').value,urg:$('aUrg').value,who:$('aPerson').value.trim()||'Unassigned',tags:tg,prjs:pj,details:$('aDetails').value});
  $('aTitle').value='';$('aDetails').value='';tagPick.clear();prjPick.clear();};
$('ftag').onchange=function(){filt.tag=this.value;render();};$('fprj').onchange=function(){filt.prj=this.value;render();};
$('jq').oninput=function(){renderEnts('PRJ');};$('sq').oninput=function(){renderEnts('SYS');};
$('addProjBtn').onclick=function(){$('addProjForm').classList.toggle('show');};$('addSysBtn').onclick=function(){$('addSysForm').classList.toggle('show');};
$('jSave').onclick=function(){var n=cleanTag($('jName').value);if(!n)return;addEntUI('PRJ',n,$('jType').value);$('jName').value='';};
$('sSave').onclick=function(){var n=cleanTag($('sName').value);if(!n)return;addEntUI('SYS',n,$('sType').value);$('sName').value='';};
(async function(){
  if(!('showDirectoryPicker' in window)){showGate('This browser cannot access local folders. Open this file in Edge or Chrome.','—');$('connect').disabled=true;return;}
  try{var h=await idbGet('dir');
    if(h){dir=h;var p=await h.queryPermission({mode:'readwrite'});if(p==='granted'){await start();return;}showGate('Reconnect to the Discerny folder (one click).','Reconnect');return;}}catch(e){}
  showGate('Connect the Discerny folder that holds TASKS.md. Your browser will ask once for permission.','Connect folder');
})();
</script></body></html>
