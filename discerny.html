<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Discerny</title>
<script>
/* Apply the saved theme before first paint so dark mode doesn't flash. */
try { var t = localStorage.getItem('discerny-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
</script>
<style>
:root{
  color-scheme:light;
  --bg:#F6F5F2;--side:#EFEDE8;--surface:#FFFFFF;--surface-2:#FAF9F6;--hover:#ECEAE4;
  --line:#E4E1DA;--line-2:#D2CEC5;--line-3:#EEECE7;--field:#8F897E;
  --ink:#1D2129;--ink-2:#2E3340;--ink-3:#3D4350;--muted:#5A606C;--id:#646A76;
  --accent:#2F44B8;--accent-ink:#1F2D82;--accent-bg:#DFE3F8;--accent-soft:#F1F3FD;--accent-bd:#8E9DE6;
  --btn:#2F44B8;--btn-ink:#FFFFFF;
  --danger:#A8261C;--danger-bg:#FBE9E7;--danger-bd:#F3C9C3;
  --warn:#8A4500;--warn-bg:#FCEEDB;--warn-bd:#F1D3A8;
  --ok:#1E6542;--ok-bg:#E2F1E8;--ok-bd:#BFDDCB;
  --info:#2F44B8;--info-bg:#E8EBFA;--info-bd:#C7CEF2;
  --claude:#9A3F21;--claude-bg:#F8E7DF;--claude-bd:#EBC3B1;
  --plain:#3D4350;--plain-bg:#EEECE7;--plain-bd:#E0DDD6;
  --flag-bd:#8B909B;
  --toast:#1D2129;--toast-ink:#FFFFFF;--toast-link:#AFC0FF;--toast-bd:#5C6273;
  --scrim:rgba(29,33,41,.38);--shadow:0 18px 48px rgba(29,33,41,.24);
  --focus:#2F44B8;
  --font:"Segoe UI Variable Text","Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif;
  --font-d:"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,"Helvetica Neue",sans-serif;
  --mono:"Cascadia Mono","Cascadia Code",Consolas,ui-monospace,"SF Mono",Menlo,monospace;
  --side-w:232px;--panel-w:clamp(380px,30vw,440px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#15171C;--side:#1B1E24;--surface:#20232A;--surface-2:#1A1D23;--hover:#2A2E37;
  --line:#2F333C;--line-2:#3E434E;--line-3:#292D35;--field:#6B717D;
  --ink:#E8EAEE;--ink-2:#D6D9DF;--ink-3:#C3C7CF;--muted:#A3A9B4;--id:#9CA2AD;
  --accent:#A3B1FF;--accent-ink:#C9D1FF;--accent-bg:#2B3363;--accent-soft:#232945;--accent-bd:#5869D1;
  --btn:#4659D2;--btn-ink:#FFFFFF;
  --danger:#FF9E92;--danger-bg:#3B201D;--danger-bd:#6E312A;
  --warn:#F3BA6E;--warn-bg:#392A16;--warn-bd:#6C4C20;
  --ok:#84D8A8;--ok-bg:#17312A;--ok-bd:#2D5C47;
  --info:#AEBBFF;--info-bg:#252C50;--info-bd:#3D4884;
  --claude:#F3A78B;--claude-bg:#3B261E;--claude-bd:#6E402E;
  --plain:#C3C7CF;--plain-bg:#2A2E36;--plain-bd:#3E434E;
  --flag-bd:#80868F;
  --toast:#E8EAEE;--toast-ink:#15171C;--toast-link:#2F44B8;--toast-bd:#AAB0BB;
  --scrim:rgba(0,0,0,.55);--shadow:0 18px 48px rgba(0,0,0,.5);--focus:#A3B1FF;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#15171C;--side:#1B1E24;--surface:#20232A;--surface-2:#1A1D23;--hover:#2A2E37;
  --line:#2F333C;--line-2:#3E434E;--line-3:#292D35;--field:#6B717D;
  --ink:#E8EAEE;--ink-2:#D6D9DF;--ink-3:#C3C7CF;--muted:#A3A9B4;--id:#9CA2AD;
  --accent:#A3B1FF;--accent-ink:#C9D1FF;--accent-bg:#2B3363;--accent-soft:#232945;--accent-bd:#5869D1;
  --btn:#4659D2;--btn-ink:#FFFFFF;
  --danger:#FF9E92;--danger-bg:#3B201D;--danger-bd:#6E312A;
  --warn:#F3BA6E;--warn-bg:#392A16;--warn-bd:#6C4C20;
  --ok:#84D8A8;--ok-bg:#17312A;--ok-bd:#2D5C47;
  --info:#AEBBFF;--info-bg:#252C50;--info-bd:#3D4884;
  --claude:#F3A78B;--claude-bg:#3B261E;--claude-bd:#6E402E;
  --plain:#C3C7CF;--plain-bg:#2A2E36;--plain-bd:#3E434E;
  --flag-bd:#80868F;
  --toast:#E8EAEE;--toast-ink:#15171C;--toast-link:#2F44B8;--toast-bd:#AAB0BB;
  --scrim:rgba(0,0,0,.55);--shadow:0 18px 48px rgba(0,0,0,.5);--focus:#A3B1FF;
}

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 var(--font);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default;opacity:.55}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.mono,.id{font-family:var(--mono)}
.id{font-size:12px;color:var(--id);white-space:nowrap}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
svg.i.s{width:13px;height:13px;stroke-width:2.1}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:var(--side-w) minmax(0,1fr) auto;height:100vh;height:100dvh}
.app.rail{--side-w:56px}
.side{grid-column:1;overflow-y:auto;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px;padding:14px 10px 12px}
.main{grid-column:2;overflow-y:auto;min-width:0;position:relative}
.panel{grid-column:3;width:var(--panel-w);overflow-y:auto;background:var(--surface);border-left:1px solid var(--line)}
.app.drawer .panel{position:fixed;top:0;right:0;bottom:0;width:min(440px,100vw);z-index:40;box-shadow:var(--shadow)}
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:39;border:0;padding:0;margin:0;width:100%}

/* ---------- sidebar ---------- */
.brand{display:flex;align-items:center;gap:10px;padding:2px 6px 12px;min-width:0}
.logo{width:30px;height:30px;border-radius:8px;background:var(--btn);color:var(--btn-ink);display:grid;place-items:center;flex:none}
.logo svg.i{width:18px;height:18px;stroke-width:2.4}
.brand-t{display:flex;flex-direction:column;line-height:1.25;min-width:0}
.brand-t b{font-weight:600;font-size:15px}
.brand-t span{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.searchbtn{display:flex;align-items:center;gap:8px;width:100%;min-height:36px;margin:0 0 10px;padding:6px 10px;border:1px solid var(--line-2);border-radius:8px;background:var(--surface);color:var(--muted);font-size:13px;text-align:left}
.searchbtn:hover{border-color:var(--field)}
.kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line-2);border-radius:4px;padding:0 5px;color:var(--muted);white-space:nowrap}
.navh{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:12px 10px 4px}
.nav{position:relative;display:flex;align-items:center;gap:10px;width:100%;min-height:36px;border:0;border-radius:8px;padding:7px 10px;background:none;color:var(--ink-2);text-align:left;font-size:14px}
.nav:hover{background:var(--hover)}
.nav[aria-current="page"]{background:var(--accent-bg);color:var(--accent-ink);font-weight:600}
.nav .cnt{margin-left:auto;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.nav[aria-current="page"] .cnt{color:var(--accent-ink)}
.side-foot{margin-top:auto;padding:14px 4px 0;display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.status{display:flex;align-items:center;gap:7px;color:var(--ink-2);min-height:24px;padding:0 6px}
.dot{width:8px;height:8px;border-radius:50%;flex:none;background:var(--ok)}
.dot.busy{background:var(--warn)}
.dot.err{background:var(--danger)}
.foot-btn{display:flex;align-items:center;gap:8px;border:0;background:none;color:var(--ink-2);padding:6px;border-radius:7px;font-size:13px;text-align:left;min-height:32px}
.foot-btn:hover{background:var(--hover)}
.side-foot .ver{padding:6px 6px 0}
.app.rail .side{padding:12px 6px;align-items:center}
.app.rail .hide-rail{display:none}
.app.rail .brand{padding:2px 0 10px}
.app.rail .searchbtn{width:44px;justify-content:center;padding:6px 0}
.app.rail .nav{width:44px;justify-content:center;padding:10px 0}
.app.rail .nav .cnt{position:absolute;top:1px;right:0;margin:0;min-width:17px;height:17px;padding:0 4px;border-radius:999px;background:var(--surface);border:1px solid var(--line-2);font-size:10.5px;line-height:15px;text-align:center;color:var(--ink-2)}
.app.rail .nav .cnt:empty{display:none}
.app.rail .navh{padding:10px 0 2px;width:40px;height:1px;border-top:1px solid var(--line-2);margin:8px 0 6px;font-size:0}
.app.rail .side-foot{padding:10px 0 0;align-items:center}
.app.rail .status{padding:0;justify-content:center}
.app.rail .foot-btn{justify-content:center;width:40px}

/* ---------- main column ---------- */
.head{position:sticky;top:0;z-index:5;background:var(--bg);padding:16px 28px 12px;border-bottom:1px solid transparent}
.head.scrolled{border-bottom-color:var(--line)}
.head-in{max-width:1024px;margin:0 auto;display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 20px}
.crumb{display:inline-flex;align-items:center;gap:4px;border:0;background:none;padding:2px 0;margin:0 0 4px;color:var(--accent);font-size:13px}
.head h1{margin:0;font:600 24px/1.2 var(--font-d);letter-spacing:-.01em}
.head .sub{margin-top:3px;color:var(--muted)}
.head-tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.wrap{max-width:1080px;margin:0 auto;padding:6px 28px 72px}
@media (max-height:700px){
  .head{padding:10px 24px 8px}
  .head h1{font-size:20px}
  .head .titles{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
  .head .sub{margin:0}
  .wrap{padding-bottom:40px}
}
.banner{display:flex;flex-wrap:wrap;align-items:center;gap:10px;border-radius:10px;padding:10px 14px;margin:0 0 14px;border:1px solid var(--warn-bd);background:var(--warn-bg);color:var(--warn)}
.banner.err{border-color:var(--danger-bd);background:var(--danger-bg);color:var(--danger)}
.banner .grow{flex:1;min-width:200px}

/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:32px;padding:4px 12px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);font-size:13px;font-weight:500;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--accent)}
.btn.quiet:hover{background:var(--hover)}
.btn.danger{color:var(--danger);border-color:var(--danger-bd);background:var(--surface)}
.btn.sm{min-height:28px;padding:2px 10px;font-size:12.5px}
.btn.lg{min-height:38px;padding:6px 16px;font-size:14px}
.btn.icon{min-width:32px;padding:4px}
.link{background:none;border:0;padding:0;color:var(--accent);text-decoration:underline;text-underline-offset:2px;font-size:13px;text-align:left}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;min-height:32px;padding:5px 12px;font-size:13px;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--line-2)}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--btn);color:var(--btn-ink)}
.chipbtn{border:1px solid var(--line-2);background:var(--surface);color:var(--ink-2);border-radius:999px;min-height:30px;padding:3px 11px;font-size:13px}
.chipbtn:hover{background:var(--hover)}
.chipbtn[aria-pressed="true"]{background:var(--accent-bg);color:var(--accent-ink);border-color:var(--accent-bd)}
.in{min-height:34px;padding:5px 9px;border:1px solid var(--field);border-radius:7px;background:var(--surface);color:var(--ink);font-size:14px;max-width:100%}
textarea.in{resize:vertical;width:100%;line-height:1.45}
select.in{padding-right:28px}
input[type="checkbox"]{width:17px;height:17px;margin:0;accent-color:var(--btn);flex:none;cursor:pointer}
.err-t{font-size:12.5px;color:var(--danger);margin-top:4px}
.hint{font-size:12.5px;color:var(--muted)}

/* ---------- badges ---------- */
.b{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:500;line-height:18px;padding:1px 8px;border-radius:999px;border:1px solid var(--plain-bd);background:var(--plain-bg);color:var(--plain);white-space:nowrap}
.b.danger{color:var(--danger);background:var(--danger-bg);border-color:var(--danger-bd)}
.b.warn{color:var(--warn);background:var(--warn-bg);border-color:var(--warn-bd)}
.b.ok{color:var(--ok);background:var(--ok-bg);border-color:var(--ok-bd)}
.b.info{color:var(--info);background:var(--info-bg);border-color:var(--info-bd)}
.b.claude{color:var(--claude);background:var(--claude-bg);border-color:var(--claude-bd)}
.b.soft{color:var(--muted);background:transparent;border-color:var(--plain-bd)}
.b.flag{color:var(--ink);background:transparent;border-color:var(--flag-bd)}
.b.when{font-weight:600}

/* ---------- lists ---------- */
.list{container-type:inline-size}
.sec{margin:0 0 22px}
.sech{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin:0 0 8px}
.sech h2{margin:0;font-size:12.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-3)}
.sech .n{font-size:13px;color:var(--muted)}
.sech .sp{margin-left:auto}
.sec-sub{font-size:13px;color:var(--muted);margin:-4px 0 8px}
.rows{display:flex;flex-direction:column;gap:6px}
.empty{color:var(--muted);padding:4px 2px}
.row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 12px;align-items:start;padding:10px 12px 10px 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px}
.row.sel{background:var(--accent-soft);border-color:var(--accent-bd)}
.row .lead{padding-top:2px;display:flex;align-items:center;min-height:20px}
.row .pip{width:8px;height:8px;border-radius:50%;margin:0 4.5px;background:var(--accent)}
.row .pip.grey{background:var(--flag-bd)}
.row .body{min-width:0}
.t{display:block;width:100%;text-align:left;background:none;border:0;padding:0;margin:0;font-weight:600;font-size:15px;line-height:1.35;color:var(--ink);overflow-wrap:anywhere}
.t:hover{text-decoration:underline;text-underline-offset:2px}
.t .tm{font-family:var(--mono);font-weight:500;color:var(--accent-ink);margin-right:8px}
.row.done .t{color:var(--muted);text-decoration:line-through}
.meta{font-size:13px;color:var(--muted);margin-top:2px;overflow-wrap:anywhere}
.right{display:flex;flex-wrap:wrap;justify-content:flex-end;align-items:center;gap:6px;max-width:min(52cqi,460px)}
.reasons{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
@container (max-width:720px){
  .row{grid-template-columns:auto minmax(0,1fr)}
  .row .right{grid-column:2;justify-content:flex-start;max-width:none;margin-top:4px}
}

/* ---------- today cards ---------- */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;margin:0 0 20px}
.card{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;color:var(--ink)}
.card:hover{border-color:var(--field)}
.card .k{font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.card .v{font-size:16px;font-weight:600}
.card .v.claude{color:var(--claude)}
.card .v.accent{color:var(--accent-ink)}
.card .s{font-size:13px;color:var(--muted)}
@media (max-height:700px){
  .cards{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
  .card{flex-direction:row;align-items:baseline;gap:8px;padding:5px 12px;border-radius:999px}
  .card .s{display:none}
  .card .v{font-size:13.5px}
}

/* ---------- quick add ---------- */
.qa{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:0 0 18px}
.qa label{display:block;font-size:12px;font-weight:600;color:var(--muted);margin:0 0 6px}
.qa-row{display:flex;gap:8px}
.qa-row .in{flex:1;min-width:0;min-height:38px;font-size:15px}
.qa-more{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-start;margin-top:8px}
.qa-more .fl{display:flex;flex-direction:column;gap:4px;font-size:12.5px;color:var(--muted)}
.qa-more .fl:last-child{flex:1;min-width:min(260px,100%)}
.qa-more textarea{resize:vertical;font:inherit}
.qa-prev{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.qa-type{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;border:1px solid var(--accent-bd);background:var(--info-bg);color:var(--accent-ink)}
.qa-title{font-size:13px;color:var(--ink-2);margin-top:6px}
@media (max-height:700px){.qa{padding:8px 10px;margin-bottom:12px}.qa label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}}

/* ---------- details panel ---------- */
.pin{padding:16px 16px 40px;display:flex;flex-direction:column;gap:14px}
.ph{display:flex;align-items:center;gap:8px}
.idbtn{display:inline-flex;align-items:center;gap:5px;border:0;border-radius:6px;background:var(--plain-bg);color:var(--ink-2);min-height:28px;padding:3px 8px;font-family:var(--mono);font-size:12px}
.title-in{width:100%;font:600 18px/1.3 var(--font-d);border:1px solid var(--line);border-radius:8px;padding:6px 8px;resize:vertical;background:var(--surface);color:var(--ink)}
.title-in:hover{border-color:var(--field)}
.note{border-radius:10px;padding:9px 12px;font-size:13px;border:1px solid var(--info-bd);background:var(--info-bg);color:var(--accent-ink)}
.note.ok{border-color:var(--ok-bd);background:var(--ok-bg);color:var(--ok)}
.note.claude{border-color:var(--claude-bd);background:var(--claude-bg);color:var(--ink-2)}
.note.warn{border-color:var(--warn-bd);background:var(--warn-bg);color:var(--warn)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line)}
.tab{border:0;background:none;min-height:36px;padding:8px 11px;margin-bottom:-1px;border-bottom:2px solid transparent;color:var(--muted);font-weight:500}
.tab[aria-selected="true"]{color:var(--accent-ink);border-bottom-color:var(--accent);font-weight:600}
.fields{display:flex;flex-direction:column;gap:10px}
.f{display:grid;grid-template-columns:96px minmax(0,1fr);gap:8px 10px;align-items:center}
.f.top{align-items:start}
.f>.lbl{font-size:13px;font-weight:500;color:var(--ink-3)}
.f.top>.lbl{padding-top:6px}
.f .ctl{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-width:0}
.h3{margin:6px 0 2px;font-size:12.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-3)}
.h3 .n{font-weight:400;color:var(--muted);text-transform:none;letter-spacing:0}
.subrow{display:flex;align-items:center;gap:8px;min-height:30px}
.subrow label{flex:1;cursor:pointer;overflow-wrap:anywhere}
.subrow.x label{color:var(--muted);text-decoration:line-through}
.xbtn{border:0;background:none;color:var(--muted);min-width:28px;min-height:28px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;padding:0}
.xbtn:hover{background:var(--hover);color:var(--ink)}
.tag{display:inline-flex;align-items:center;gap:2px;font-size:13px;padding:1px 2px 1px 10px;border-radius:999px;color:var(--plain);background:var(--plain-bg);border:1px solid var(--plain-bd)}
.tag .xbtn{min-width:24px;min-height:24px}
.ctx{font-size:14px;color:var(--ink-2);overflow-wrap:anywhere}
.ctx.src{font-size:13px;color:var(--muted)}

var SUB = {

/* ===================== keys ===================== */
function isTyping(t) {
  if (!t || !t.tagName) return false;
  if (t.isContentEditable) return true;
  if (t.tagName === 'TEXTAREA' || t.tagName === 'SELECT') return true;

}
var KD = {

  },
  pal: function (el, ev) {

    else if (ev.key === 'ArrowUp') { ev.preventDefault(); S.palI = Math.max(idx - 1, 0); render(); }
    else if (ev.key === 'Enter') { ev.preventDefault(); runResult(flat[idx]); }

  title: function (el, ev) { if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); el.blur(); } },
  sub: function (el, ev) {
    if (ev.key !== 'Enter') return;
    ev.preventDefault();
    var t = String(el.value || '').trim(), id = did(el);
    if (!t || !item(id)) return;
    S.subDraft = ''; forceClear(el.id);
    commit(OPS.addSub(id, t));
  },
  tag: function (el, ev) { if (ev.key === 'Enter') { ev.preventDefault(); addTagFrom(el); } },
  prj: function (el, ev) {
    if (ev.key === 'Enter') { ev.preventDefault(); addPrjFrom(el, true); }
    else if (ev.key === 'Escape' && el.value) { ev.preventDefault(); S.newPrj = ''; forceClear(el.id); render(); }
  },
  composer: function (el, ev) { if (ev.key === 'Enter' && (ev.ctrlKey || ev.metaKey)) { ev.preventDefault(); if (S.sel) queueAsk(S.sel); } },
  linkq: function (el, ev) {
    if (ev.key === 'Enter') { ev.preventDefault(); var r = S.sel ? linkCands(S.sel, kindOf(S.sel) === 'T' ? S.linkMode : 'related') : null; if (r && r.length) addLink(S.sel, r[0].id); }
    else if (ev.key === 'Escape' && el.value) { ev.preventDefault(); S.linkQ = ''; forceClear(el.id); render(); }
  },
  'e-link': function (el, ev) { if (ev.key === 'Enter') { ev.preventDefault(); addEntityLink(did(el)); } }
};
function handleEsc(ev) {
  var t = ev.target;
  if (S.dialog) { ev.preventDefault(); closeDialog(); return; }
  if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA') && isTyping(t) && t.hasAttribute('data-ch')) {
    ev.preventDefault();
    if (t.value !== t.defaultValue) { t.value = t.defaultValue; }
    t.blur();
    return;
  }
  if (S.dismissFor) { S.dismissFor = null; render(); return; }
  if (S.confirm) { S.confirm = null; render(); return; }
  if (S.editAsk) { S.editAsk = null; render(); return; }
  if (S.adding) { S.adding = null; render(); return; }
  if (S.panel && S.sel) { ev.preventDefault(); closePanel(); return; }
  if (S.cur) { S.cur = null; render(); }
}
function trapTab(ev) {
  var d = document.querySelector('.dlg');
  if (!d) return;
  var f = Array.prototype.filter.call(d.querySelectorAll('button, input, select, textarea, [tabindex]:not([tabindex="-1"])'), function (x) { return !x.disabled && x.offsetParent !== null; });

var GO_KEYS = { t: 'today', i: 'inbox', n: 'next', w: 'waiting', u: 'upcoming', f: 'fyi', a: 'all', p: 'projects', e: 'people', s: 'systems', r: 'review', c: 'claude', d: 'done' };
function onKey(ev) {
  var t = ev.target;
  var kd = t && t.closest ? t.closest('[data-kd]') : null;
  if (kd && KD[kd.getAttribute('data-kd')]) { KD[kd.getAttribute('data-kd')](kd, ev); if (ev.defaultPrevented) return; }
  if (!S.ready) return;
  if ((ev.ctrlKey || ev.metaKey) && !ev.altKey && !ev.shiftKey && (ev.key === 'k' || ev.key === 'K')) { ev.preventDefault(); if (S.dialog === 'palette') closeDialog(); else openPalette(); return; }
  if (ev.key === 'Escape') { handleEsc(ev); return; }
  if (S.dialog) { if (ev.key === 'Tab') trapTab(ev); return; }
  if (t && t.getAttribute && t.getAttribute('role') === 'tab' && (ev.key === 'ArrowRight' || ev.key === 'ArrowLeft')) {
    ev.preventDefault();

  if (typing || ev.ctrlKey || ev.metaKey || ev.altKey) return;
  var key = ev.key.length === 1 ? ev.key.toLowerCase() : ev.key;
  if (S.gAt && Date.now() - S.gAt < 1500 && GO_KEYS[key]) { S.gAt = 0; ev.preventDefault(); go(GO_KEYS[key]); return; }

  var onButton = t && (t.tagName === 'BUTTON' || t.tagName === 'A' || (t.tagName === 'INPUT'));

    case '/': ev.preventDefault(); openPalette(); return;
    case '?': ev.preventDefault(); openKeys(); return;
    case 'g': S.gAt = Date.now(); return;
    case 'n': ev.preventDefault(); quickAddFocus(); return;
    case 'j': ev.preventDefault(); moveCursor(1); return;
    case 'k': ev.preventDefault(); moveCursor(-1); return;
    case 'ArrowDown': if (!onButton && t === document.body) { ev.preventDefault(); moveCursor(1); } return;
    case 'ArrowUp': if (!onButton && t === document.body) { ev.preventDefault(); moveCursor(-1); } return;
    case 'Enter': if (!onButton && S.cur) { ev.preventDefault(); select(S.cur); } return;
    case 'x': { var id = targetId(); if (id && kindOf(id) === 'T' && (whereOf(id) === 'open' || whereOf(id) === 'done')) { ev.preventDefault(); toggleDone(id, true); } return; }
    case 'a': { var a = targetId(); if (a && whereOf(a) === 'inbox') { ev.preventDefault(); accept(a); } return; }
    case 'd': { var d = targetId(); if (d && whereOf(d) === 'inbox') { ev.preventDefault(); S.dismissFor = d; S.dismissAt = S.panel && S.sel === d ? 'panel' : 'row'; if (!S.panel) S.cur = d; focusLater(S.dismissAt === 'panel' ? '.panel .reasons .chipbtn' : '.main [data-row="' + d + '"] .reasons .chipbtn'); } return; }
    case 'c': { var c = S.panel && S.sel ? S.sel : targetId(); if (c) { ev.preventDefault(); select(c, { tab: 'claude', focus: '#f-composer' }); } return; }
  }
}

/* ===================== folder access and start-up ===================== */
async function pickFolder() {
  var h;
  try { h = await window.showDirectoryPicker({ id: 'discerny', mode: 'readwrite' }); }
  catch (e) { if (e && e.name === 'AbortError') return; S.gate = { mode: 'error', msg: errText(e) }; render(); return; }
  dir = h; S.folder = h.name;
  try { await h.getFileHandle('TASKS.md'); }
  catch (e) { if (e && e.name === 'NotFoundError') { S.gate = { mode: 'wrong', msg: '“' + h.name + '” has no TASKS.md.' }; render(); return; } }
  await idbSet('dir', h);
  openFolder();
}
// Switching data folders reloads the page, so nothing from the old folder (undo, selection, timestamps) carries over.
async function changeFolder() {
  if (srv) { if (S.dialog !== 'folder') S.dlgReturn = document.activeElement; S.dialog = 'folder'; render(); focusLater('.dlg .xbtn'); return; }
  if (Q.jobs.some(function (j) { return !j.sync; })) { toastShow('Wait until your changes are saved, then change folder.'); return; }
  var h;
  try { h = await window.showDirectoryPicker({ id: 'discerny', mode: 'readwrite' }); }
  catch (e) { if (!e || e.name !== 'AbortError') toastShow('Couldn’t open the folder: ' + errText(e)); return; }
  try { await h.getFileHandle('TASKS.md'); }
  catch (e) { toastShow('“' + h.name + '” has no TASKS.md, so it isn’t a Discerny data folder.'); return; }
  if (!(await idbSet('dir', h))) { toastShow('Couldn’t remember the new folder.'); return; }
  location.reload();
}
async function regrant() {
  if (!dir) { pickFolder(); return; }
  try {
    var p = await dir.requestPermission({ mode: 'readwrite' });
    if (p === 'granted') { openFolder(); return; }
    S.gate = { mode: 'denied', msg: '' };
  } catch (e) { S.gate = { mode: 'error', msg: errText(e) }; }
  render();
}
async function openFolder() {
  S.folder = srv ? srv.name : dir.name;
  if (!srv) try { await dir.getFileHandle('TASKS.md'); }
  catch (e) {
    if (e && e.name === 'NotFoundError') S.gate = { mode: 'wrong', msg: '“' + dir.name + '” has no TASKS.md.' };
    else if (isPermErr(e)) S.gate = { mode: srv ? 'srvdown' : 'reconnect', msg: '' };
    else S.gate = { mode: 'error', msg: errText(e) };
    render();
    return;
  }
  S.gate = { mode: 'loading', msg: '' };
  render();
  try {
    var g = await formatGate();
    if (g) { S.gate = g; render(); return; }
    var m = await loadAll(); applyLoaded(m); S.lastSync = Date.now();
  }
  catch (e) { console.error(e); S.gate = isPermErr(e) ? { mode: srv ? 'srvdown' : 'reconnect', msg: '' } : { mode: 'error', msg: errText(e) }; render(); return; }
  S.ready = true;
  if (S.view === 'inbox') go('inbox');
  startTimers();
  focusLater('#page-title');
  if (Q.jobs.length) kick();
}
var timersOn = false, lastDay = '';
function startTimers() {
  if (timersOn) return;
  timersOn = true;
  lastDay = todayStr();
  setInterval(poll, 3000);
  setInterval(function () { if (!document.hidden) render(); if (todayStr() !== lastDay) { lastDay = todayStr(); render(); } }, 30000);
  window.addEventListener('focus', function () { poll(); render(); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { poll(); render(); } });
}
async function boot() {
  if (S.theme === 'light' || S.theme === 'dark') document.documentElement.setAttribute('data-theme', S.theme);
  document.addEventListener('click', function (ev) {
    var el = ev.target && ev.target.closest ? ev.target.closest('[data-act]') : null;
    if (!el || el.disabled) return;
    var a = el.getAttribute('data-act');
    if (a === 'dlg-bg' && ev.target !== el) return;
    if (ACT[a]) ACT[a](el, ev);
  });
  document.addEventListener('change', function (ev) { var el = ev.target, k = el && el.getAttribute ? el.getAttribute('data-ch') : null; if (k && CH[k]) CH[k](el, ev); });
  document.addEventListener('input', function (ev) { var el = ev.target, k = el && el.getAttribute ? el.getAttribute('data-in') : null; if (k && IN[k]) IN[k](el, ev); });
  document.addEventListener('submit', function (ev) { var f = ev.target, k = f.getAttribute('data-sub'); if (k && SUB[k]) { ev.preventDefault(); SUB[k](f, ev); } });
  document.addEventListener('keydown', onKey);
  document.addEventListener('scroll', function (ev) {
    var m = ev.target;

  }, true);

  if (!('showDirectoryPicker' in window)) { S.gate = { mode: 'nosupport', msg: '' }; render(); return; }
  var h = await idbGet('dir');
  if (h && h.kind === 'directory') {
    dir = h; S.folder = h.name;
    var p = 'prompt';
    try { p = await h.queryPermission({ mode: 'readwrite' }); } catch (e) { /* treat as prompt */ }
    if (p === 'granted') { openFolder(); return; }
    S.gate = { mode: 'reconnect', msg: '' };

    return;
  }

  render();
}
boot();
