<meta name="theme-color" content="#F6F5F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15171C" media="(prefers-color-scheme: dark)">
<script>
/* Colours the browser's own bars with --bg: the theme the User picked, or the system's when they haven't picked one. */
function setThemeColor(t) {
  var m = document.querySelectorAll('meta[name="theme-color"]');
  for (var i = 0; i < m.length; i++) m[i].content = (t === 'light' || t === 'dark' ? t === 'dark' : /dark/.test(m[i].media)) ? '#15171C' : '#F6F5F2';
}
/* Apply the saved theme before first paint so dark mode doesn't flash. */
try { var t = localStorage.getItem('discerny-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); setThemeColor(t); } catch (e) {}
/* The web manifest lets a served page be installed as an app. Opened as a file, the browser blocks it and logs an error, so it's left out. */
if (location.protocol === 'http:' || location.protocol === 'https:') { var mf = document.createElement('link'); mf.rel = 'manifest'; mf.href = 'manifest.webmanifest'; document.head.appendChild(mf); }
</script>
