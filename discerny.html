<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Discerny</title>
<link rel="icon" href="icons/favicon.ico" sizes="any">
<link rel="icon" href="icons/discerny-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#F6F5F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15171C" media="(prefers-color-scheme: dark)">
<script>
/* Colours the browser's own bars with --bg: the theme the User picked, or the system's when they haven't picked one. */
function setThemeColor(t) {
  var m = document.querySelectorAll('meta[name="theme-color"]');
  for (var i = 0; i < m.length; i++) m[i].content = (t === 'light' || t === 'dark' ? t === 'dark' : /dark/.test(m[i].media)) ? '#15171C' : '#F6F5F2';
}
/* Apply the saved theme before first paint so dark mode doesn't flash. */
try { var t = localStorage.getItem('discerny-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); setThemeColor(t); } catch (e) {}
/* The web manifest lets a served page be installed as an app. Opened as a file, the browser blocks it and logs an error, so it's left out. */
if (location.protocol === 'http:' || location.protocol === 'https:') { var mf = document.createElement('link'); mf.rel = 'manifest'; mf.href = 'manifest.webmanifest'; document.head.appendChild(mf); }
</script>
<link rel="stylesheet" href="ui/discerny.css">
</head>
<body>
<div id="app"></div>
<noscript><p style="padding:24px">Discerny needs JavaScript. Open it in Chrome or Edge.</p></noscript>
<script src="ui/core.js"></script>
<script src="ui/files.js"></script>
<script src="ui/model.js"></script>
<script src="ui/ops.js"></script>
<script src="ui/links.js"></script>
<script src="ui/views-shell.js"></script>
<script src="ui/views-lists.js"></script>
<script src="ui/views-records.js"></script>
<script src="ui/views-panel.js"></script>
<script src="ui/render.js"></script>
<script src="ui/input.js"></script>
<script>
'use strict';
var S = D.model.S;

/* ===================== start-up ===================== */
async function boot() {
  D.render.measure();
  if (S.theme === 'light' || S.theme === 'dark') document.documentElement.setAttribute('data-theme', S.theme);
  document.addEventListener('click', function (ev) {
    var el = ev.target && ev.target.closest ? ev.target.closest('[data-act]') : null;
    if (!el || el.disabled) return;
    var a = el.getAttribute('data-act');
    if (a === 'dlg-bg' && ev.target !== el) return;
    if (D.input.ACT[a]) D.input.ACT[a](el, ev);
  });
  document.addEventListener('change', function (ev) { var el = ev.target, k = el && el.getAttribute ? el.getAttribute('data-ch') : null; if (k && D.input.CH[k]) D.input.CH[k](el, ev); });
  document.addEventListener('input', function (ev) { var el = ev.target, k = el && el.getAttribute ? el.getAttribute('data-in') : null; if (k && D.input.IN[k]) D.input.IN[k](el, ev); });
  document.addEventListener('submit', function (ev) { var f = ev.target, k = f.getAttribute('data-sub'); if (k && D.input.SUB[k]) { ev.preventDefault(); D.input.SUB[k](f, ev); } });
  document.addEventListener('keydown', D.input.onKey);
  document.addEventListener('scroll', function (ev) {
    var m = ev.target;
    if (!m || m.id !== 'main') return;
    var s = m.scrollTop > 4;
    if (s !== S.scrolled) { S.scrolled = s; var h = m.querySelector('.head'); if (h) h.classList.toggle('scrolled', s); }
  }, true);
  window.addEventListener('resize', function () { D.render.measure(); D.render.render(); });
  // Back, Forward, an edited address or a bookmark; before the folder is read, openFolder lands on the Link instead
  window.addEventListener('hashchange', function () { if (S.ready && S.m && location.hash !== D.links.nav.hashOwn) D.input.land(); });
  window.addEventListener('beforeunload', function (ev) { if (D.files.Q.jobs.some(function (j) { return !j.sync; })) { ev.preventDefault(); ev.returnValue = ''; } });
  // Served by node tools/discern.mjs serve: the server reads and writes the folder, so no picker or permission.
  if (location.protocol === 'http:' && (await D.files.serverInfo())) { D.input.openFolder(); return; }
  if (!('showDirectoryPicker' in window)) { S.gate = { mode: 'nosupport', msg: '' }; D.render.render(); return; }
  var h = await D.files.idbGet('dir');
  if (h && h.kind === 'directory') {
    D.files.useFolder(h); S.folder = h.name;
    var p = 'prompt';
    try { p = await h.queryPermission({ mode: 'readwrite' }); } catch (e) { /* treat as prompt */ }
    if (p === 'granted') { D.input.openFolder(); return; }
    S.gate = { mode: 'reconnect', msg: '' };
    D.render.render();
    return;
  }
  S.gate = { mode: 'pick', msg: '' };
  D.render.render();
}
boot();
</script>
</body>
</html>
