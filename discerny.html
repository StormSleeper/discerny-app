/* Colours the browser's own bars with --bg: the theme the User picked, or the system's when they haven't picked one. */
function setThemeColor(t) {
  var m = document.querySelectorAll('meta[name="theme-color"]');
  for (var i = 0; i < m.length; i++) m[i].content = (t === 'light' || t === 'dark' ? t === 'dark' : /dark/.test(m[i].media)) ? '#15171C' : '#F6F5F2';
}
/* Apply the saved theme before first paint so dark mode doesn't flash. */
try { var t = localStorage.getItem('discerny-theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); setThemeColor(t); } catch (e) {}
/* The web manifest lets a served page be installed as an app. Opened as a file, the browser blocks it and logs an error, so it's left out. */
if (location.protocol === 'http:' || location.protocol === 'https:') { var mf = document.createElement('link'); mf.rel = 'manifest'; mf.href = 'manifest.webmanifest'; document.head.appendChild(mf); }
</script>

'use strict';
var S = D.model.S;

/* ===================== retrying a save, and noticing edits from outside ===================== */
async function regainAccess() {
  if (D.files.srv) {
    // A server started again on another folder: reload rather than save this folder's changes into it.
    var was = D.files.srv.folder;
    if (!(await D.files.serverInfo())) return false;
    if (D.files.srv.folder !== was) { location.reload(); return false; }
    S.lost = false;
    return true;
  }
  try { var p = await D.files.dir.requestPermission({ mode: 'readwrite' }); if (p === 'granted') { S.lost = false; return true; } } catch (e) { /* not allowed without a click */ }
  return false;
}
async function retrySave() {
  if (S.lost && !(await regainAccess())) { render(); return; }
  D.files.Q.blocked = null;
  D.files.kick();
}
async function poll() {
  if (!S.ready || S.moved || D.files.Q.running || D.files.Q.jobs.length || D.files.Q.blocked || document.hidden) return;
  try {
    var changed = false;
    var mt = D.files.srv ? await D.files.serverMtimes() : null;
    for (var i = 0; i < WATCH.length; i++) { var t = mt ? mt[WATCH[i]] || 0 : await D.files.modOf(WATCH[i]); if (t !== (D.files.lastMod[WATCH[i]] || 0)) { changed = true; break; } }
    if (changed) D.files.requestSync(true);
    else if (Date.now() - (S.lastSync || 0) > 30000) D.files.requestSync(false);
  } catch (e) { if (D.files.isMoved(e)) { S.moved = true; render(); } else if (D.files.isPermErr(e)) { S.lost = true; render(); } }
}

/* ===================== people, projects and systems ===================== */
function prioMark(p) { return D.model.isPrio(p) ? badge('Priority', 'flag prio-m') : ''; }
// A row's number and bar. The bar is out of the highest score anywhere, so that a filter doesn't change what it means.
function scoreCell(p) {
  if (!scoreable(p)) return '<div class="score"></div>';
  var n = D.model.scoreOf(p), top = D.model.scored().top, pct = top ? Math.round(n / top * 100) : 0;
  return '<div class="score"><span class="sr">Interaction score </span><span class="score-n">' + D.model.scoreText(n) + '</span><span class="score-bar" aria-hidden="true"><span style="width:' + pct + '%"></span></span></div>';
}
function scoreFact(p) {
  if (!scoreable(p)) return fact('Interaction score', [fv(D.model.isMe(p) ? 'Not scored: this is you' : p.meta.status === 'left' ? 'Not scored: they have left' : 'Not scored')]);
  return fact('Interaction score', [fv(D.model.scoreText(D.model.scoreOf(p))), '<span class="hint">' + esc(scoreExplanation(D.model.scored().events, p.meta.id, D.model.SET.values, D.model.todayStr())) + '</span>']);
}
// The Promote or Demote button: locked on the User's manager, and absent on the User, on anyone with no ID and on someone who has left, unless they're still listed
function prioToggle(p, cls) {
  var s = D.model.prioOf(p), c = (cls ? cls + ' ' : '') + 'prio-t';
  if (s === 'manager') return '<button type="button" class="btn ' + c + '" aria-disabled="true" aria-label="' + esc(p.name + ' is your manager, and always counts as a Priority person') + '" title="Your manager always counts as a Priority person">' + ic('lock', 's') + 'Always</button>';
  if (s === 'user' || !p.meta.id || (s === 'off' && p.meta.status === 'left')) return '';
  var label = s === 'on' ? 'Demote ' + p.name + ', so they are no longer a Priority person' : 'Promote ' + p.name + ' to a Priority person';
  return bt(s === 'on' ? 'Demote' : 'Promote', s === 'on' ? 'demote' : 'promote', { id: p.meta.id, cls: c, attrs: ' aria-label="' + esc(label) + '" title="' + esc(label) + '"' });
}

/* ===================== the Link row in search ===================== */
function search(qs) {
  var groups = D.model.searchAll(qs), link = linkResult(qs);
  if (link) groups.unshift({ title: 'Link', items: [link] });
  return groups;
}

/* ===================== html helpers ===================== */
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function badge(text, tone) { return '<span class="b' + (tone ? ' ' + tone : '') + '">' + esc(text) + '</span>'; }
function slug(s) { return String(s).replace(/[^A-Za-z0-9_-]+/g, '_'); }
function dv(k, v) { return v == null || v === '' ? '' : ' data-' + k + '="' + esc(v) + '"'; }
function bt(label, act, o) {
  o = o || {};
  return '<button type="button" class="btn' + (o.cls ? ' ' + o.cls : '') + '" data-act="' + act + '"' + dv('id', o.id) + dv('v', o.v) + (o.attrs || '') + '>' + (o.icon ? ic(o.icon, 's') : '') + esc(label) + '</button>';
}
function lk(label, act, o) { o = o || {}; return '<button type="button" class="link" data-act="' + act + '"' + dv('id', o.id) + dv('v', o.v) + (o.attrs || '') + '>' + esc(label) + '</button>'; }
function opts(list, cur) {
  return list.map(function (o) { var v = Array.isArray(o) ? o[0] : o, l = Array.isArray(o) ? o[1] : o; return '<option value="' + esc(v) + '"' + (v === cur ? ' selected' : '') + '>' + esc(l) + '</option>'; }).join('');
}
function pressed(on) { return ' aria-pressed="' + (on ? 'true' : 'false') + '"'; }
var ICONS = {
  lock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  today: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  inbox: '<path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.5 5.1 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.5-6.9A2 2 0 0 0 16.8 4H7.2a2 2 0 0 0-1.7 1.1z"/>',
  next: '<path d="m3 6 1.5 1.5L7 5M3 12l1.5 1.5L7 11M3 18l1.5 1.5L7 17M11 6h10M11 12h10M11 18h10"/>',

  upcoming: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  fyi: '<circle cx="12" cy="12" r="9"/><path d="M12 16v-5M12 8h.01"/>',

  projects: '<path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.7-.9l-.8-1.2A2 2 0 0 0 7.9 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2z"/>',
  people: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',
  systems: '<rect x="2" y="3" width="20" height="8" rx="2"/><rect x="2" y="13" width="20" height="8" rx="2"/><path d="M6 7h.01M6 17h.01"/>',
  review: '<rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2M9 14l2 2 4-4"/>',
  done: '<circle cx="12" cy="12" r="9"/><path d="m8 12 3 3 5-6"/>',
  claude: '<path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"/><path d="M19 16v4M17 18h4"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  x: '<path d="M18 6 6 18M6 6l12 12"/>',
  back: '<path d="m15 18-6-6 6-6"/>',
  ext: '<path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
  link: '<path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/>',
  copy: '<rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
  keys: '<rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/>',
  sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>',
  moon: '<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>',
  auto: '<circle cx="12" cy="12" r="9"/><path d="M12 3v18" /><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor" stroke="none"/>',
  folder: '<path d="M4 20h16a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.7-.9l-.8-1.2A2 2 0 0 0 7.9 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2z"/><path d="M9 13h6M12 10l3 3-3 3"/>',
  sideOpen: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M13 9l3 3-3 3"/>',
  sideClose: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M16 9l-3 3 3 3"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  chev: '<path d="m6 9 6 6 6-6"/>',
  edit: '<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/>',
  refresh: '<path d="M21 12a9 9 0 1 1-2.6-6.4L21 8"/><path d="M21 3v5h-5"/>',
  open: '<path d="M7 17 17 7M8 7h9v9"/>'
};
// The Discerny icon in the header's tile, by a path relative to the page so it loads served and opened as a file.
var LOGO = '<img src="icons/discerny-96.png" alt="" width="40" height="40">';
function ic(n, cls) { return '<svg class="i' + (cls ? ' ' + cls : '') + '" viewBox="0 0 24 24" aria-hidden="true" focusable="false">' + (ICONS[n] || '') + '</svg>'; }
function linkA(l) {
  var u = D.model.safeUrl(l.url);
  return u ? '<a class="ext" href="' + esc(u) + '" target="_blank" rel="noopener noreferrer">' + esc(l.label) + ic('ext', 's') + '</a>' : '<span class="ctx">' + esc(l.label) + '</span>';
}

/* ===================== rows and sections ===================== */
function vRow(i, o) {
  o = o || {};
  var w = D.model.whereOf(i.id), inbox = w === 'inbox', done = w === 'done', waiting = D.model.isWaiting(i), fyi = i.meta.type === 'fyi' && !done && !inbox, due = dueOf(i.meta);
  var meta = [];
  if (!o.hideProject) { var ps = prjOf(i).map(function (p) { var e = D.model.entById(p); return e ? D.model.short(e.name) : p; }); if (ps.length) meta.push(ps.join(', ')); }
  var who = D.model.realWho(i);
  if (!o.hidePerson && who) meta.push((waiting ? 'waiting on ' : (i.meta.type === 'meeting' ? 'with ' : '')) + who);
  var subs = D.model.subsOf(i);
  if (subs.length) meta.push(subs.filter(function (x) { return x.x; }).length + ' of ' + subs.length + ' sub-tasks');
  if (inbox) meta.push('from ' + D.model.srcKind(i));
  if (done && i.meta['done-date']) meta.push('done ' + D.model.fmt(i.meta['done-date']));
  var badges = '';
  if (S.fresh.has(i.id)) badges += badge('Updated', 'info');
  if (!done) {
    var bl = D.model.openBlockers(i);
    if (bl.length) badges += badge('Depends on ' + bl.join(', '), 'danger');
    if (waiting && !inbox) { var a = D.model.age(i); badges += badge('Waiting ' + D.model.plural(a, 'day'), a >= 14 ? 'warn' : 'info'); }
    if (i.meta.status === 'in progress') badges += badge(STATUS_LABEL['in progress']);
    if (i.meta.priority === 'high') badges += badge(PRIORITY_LABEL.high, 'flag');
    var n = D.model.asksFor(i.id).length;
    if (n) badges += badge(n + ' for agent', 'claude');
    if (D.model.draftsFor(i.id).length) badges += badge('Draft ready', 'claude');
  }
  var wh = D.model.when(i), whenLabel = wh.label;
  if (waiting && D.model.isDay(due)) whenLabel = 'Promised ' + D.model.fmt(due);
  var showWhen = !done && !o.hideWhen && !(waiting && !D.model.isDay(due)) && !(fyi && !D.model.isDay(due));
  var time = o.timeFirst ? D.model.timeOf(due) : '';
  var title = o.waiting ? D.model.waitTitle(i) : i.title;
  var lead = (inbox || fyi) ? '<span class="pip' + (fyi ? ' grey' : '') + '" aria-hidden="true"></span>'
    : '<input type="checkbox" data-ch="done" data-id="' + i.id + '"' + (done ? ' checked' : '') + ' aria-label="' + esc((done ? 'Reopen: ' : 'Mark done: ') + i.title) + '">';
  var acts = '';
  if (inbox) acts = bt('Accept', 'accept', { id: i.id, cls: 'primary sm' }) + doneBtn(i, 'sm') + bt('Dismiss…', 'dismiss-open', { id: i.id, cls: 'sm', attrs: ' aria-expanded="' + (S.dismissFor === i.id) + '"' });
  else if (o.snooze && D.model.canSnooze(i)) acts = bt('Snooze…', 'snooze-open', { id: i.id, cls: 'sm', attrs: ' aria-expanded="' + (S.snoozeFor === i.id) + '"' });
  else if (!done && o.waiting && waiting) acts = bt('Chase', 'chase', { id: i.id, cls: 'sm' }) + bt('Got it', 'gotit', { id: i.id, cls: 'sm' });
  else if (fyi) acts = bt('Acknowledge', 'ack', { id: i.id, cls: 'sm' }) + bt('Make it a task', 'maketask', { id: i.id, cls: 'sm quiet' });
  var reasons = inbox && S.dismissFor === i.id && S.dismissAt !== 'panel' ? vReasons(i.id) : (o.snooze && S.snoozeFor === i.id && D.model.canSnooze(i) ? '<div class="reasons">' + vSnooze(i.id) + lk('Cancel', 'snooze-cancel') + '</div>' : '');
  var sel = S.sel === i.id && S.panel;
  return '<div class="row' + (sel ? ' sel' : '') + (S.cur === i.id ? ' cur' : '') + (done ? ' done' : '') + '" data-k="r-' + i.id + '" data-row="' + i.id + '">' +
    '<div class="lead">' + lead + '</div>' +
    '<div class="body"><button type="button" class="t" data-act="open" data-id="' + i.id + '"' + (sel ? ' aria-current="true"' : '') + '>' + (time ? '<span class="tm">' + time + '</span>' : '') + esc(title) + '</button>' +
    (meta.length ? '<div class="meta">' + esc(meta.join(' · ')) + '</div>' : '') +
    (D.model.firstLine(i) ? '<div class="sum">' + esc(D.model.clip(D.model.firstLine(i), 140)) + '</div>' : '') +
    (o.showTags && tagsOf(i).length ? '<div class="pills">' + tagsOf(i).map(function (t) { return '<button type="button" class="chipbtn" data-act="wb-tag" data-v="' + esc(t) + '"' + pressed(S.wb.tag === t) + ' title="Show only #' + esc(t) + '">#' + esc(t) + '</button>'; }).join('') + '</div>' : '') + (inbox ? vItemChanges(i.id) : '') + reasons + '</div>' +
    '<div class="right">' + badges + (showWhen ? '<span class="b when' + (wh.tone ? ' ' + wh.tone : '') + '">' + esc(whenLabel) + '</span>' : '') + acts + '<span class="id">' + i.id + '</span></div></div>';
}
var REASONS = ['Not actionable', 'Already handled', 'Duplicate', 'Not mine'];
// Done: on an FYI it reads Acknowledge; on a Proposal it accepts and marks done in one step
function doneBtn(i, cls) { return bt(i.meta.type === 'fyi' ? 'Acknowledge' : 'Done', 'done-now', { id: i.id, cls: cls, attrs: D.model.whereOf(i.id) === 'inbox' ? ' title="Accept and mark done"' : '' }); }
var SNOOZE = [[1, '+1 day'], [3, '+3 days'], [7, '+1 week'], [28, '+4 weeks']];
function vSnooze(id) { return '<div class="seg" data-k="seg-snooze" role="group" aria-label="Snooze ' + id + ' from today">' + SNOOZE.map(function (x) { return '<button type="button" data-act="snooze" data-id="' + id + '" data-v="' + x[0] + '">' + x[1] + '</button>'; }).join('') + '</div>'; }
function vReasons(id) {
  if (S.dupFor === id) return '<div class="box" data-k="reasons-dup" style="margin-top:8px"><label class="h3" for="f-dupq" style="margin:0">Which item does ' + id + ' duplicate?</label>' +
    '<div class="hint">It is merged into the item you pick, which keeps its own ID and gains everything ' + id + ' holds.</div>' +
    '<input id="f-dupq" class="in" type="search" autocomplete="off" data-in="dupQ" data-kd="dupq" data-id="' + id + '" value="' + esc(S.dupQ) + '" placeholder="Find the item it duplicates">' +
    vPicks(mergeCands(id, S.dupQ), 'dup-pick', 'No match. Meetings never merge.') + '<div>' + lk('Cancel', 'dismiss-cancel') + '</div></div>';
  return '<div class="reasons" data-k="reasons" role="group" aria-label="Why are you dismissing ' + id + '?"><span class="hint">Why?</span>' +
    REASONS.map(function (r) { return '<button type="button" class="chipbtn" data-act="dismiss" data-id="' + id + '" data-v="' + esc(r) + '">' + esc(r) + '</button>'; }).join('') +
    lk('Cancel', 'dismiss-cancel') + '</div>';
}
function vSec(key, title, rows, o) {
  o = o || {};
  var hid = 'h-' + slug(key);
  var count = o.count !== undefined ? o.count : rows.length;
  var h = '<section class="sec" data-k="s-' + esc(key) + '" aria-labelledby="' + hid + '"><div class="sech"><h2 id="' + hid + '">' + esc(title) + '</h2>';
  if (count !== '' && count != null) h += '<span class="n">' + esc(count) + '</span>';
  if (o.hint) h += '<span class="n">· ' + esc(o.hint) + '</span>';
  if (o.link) h += '<span class="sp"></span>' + o.link;
  h += '</div>';
  if (o.sub) h += '<div class="sec-sub">' + esc(o.sub) + '</div>';
  if (rows.length) h += '<div class="rows">' + rows.join('') + '</div>';
  else if (o.empty) h += '<div class="empty">' + esc(o.empty) + '</div>';
  return h + '</section>';
}
function rowsOf(list, o) { return list.map(function (i) { return vRow(i, o); }); }

/* ===================== focus lists ===================== */
function viewToday() {
  var open = D.model.openList().filter(function (i) { return i.meta.type !== 'fyi' && !D.model.isWaiting(i); });
  var overdue = D.model.sortItems(open.filter(function (i) { return isOverdue(i, D.model.todayStr()); }));
  var dueToday = D.model.sortByDue(open.filter(function (i) { var d = dueOf(i.meta); return D.model.isDay(d) && D.model.dd(d) === 0; }));
  var planned = D.model.sortItems(open.filter(function (i) { return !D.model.isDay(dueOf(i.meta)) && i.meta.urgency === 'today'; }));
  var horizon = D.model.addWorkdays(D.model.todayStr(), 3);
  var coming = D.model.sortByDue(open.filter(function (i) { var d = dueOf(i.meta); return D.model.isDay(d) && D.model.dd(d) > 0 && d.slice(0, 10) <= horizon; }));
  var b = '';
  if (overdue.length) b += vSec('overdue', 'Overdue', rowsOf(overdue, { snooze: true }));
  b += vSec('duetoday', 'Due today', rowsOf(dueToday, { timeFirst: true }), { empty: 'Nothing is due today.' });
  if (planned.length) b += vSec('planned', 'Planned for today', rowsOf(planned), { hint: 'marked Today, no date set' });
  b += vSec('coming', 'Coming up', rowsOf(coming), { hint: 'next 3 working days', empty: 'Nothing dated in the next 3 working days.', link: lk('See everything upcoming', 'go', { v: 'upcoming' }) });
  var sub = [D.model.fmtLong(D.model.todayStr())];
  if (overdue.length) sub.push(overdue.length + ' overdue');
  sub.push(dueToday.length + ' due today', coming.length + ' coming up');
  return { title: 'Today', sub: sub.join(' · '), qa: true, cards: true, body: '<div class="list">' + b + '</div>' };

// the relate search: o.kind ('All', an Item type, 'Person', 'Project' or 'System') and o.done (search DONE.md too) -> {list, more} or null
var LINK_KINDS = ['All', 'Task', 'Meeting', 'Process', 'Document', 'FYI', 'Person', 'Project', 'System'], LINK_MAX = 50;
function linkCands(id, mode, q, o) {
  o = o || {};
  q = String(q || '').trim().toLowerCase();
  if (!q) return null;
  var linked = {}, blocked = mode === 'blocked', kind = o.kind || 'All';
  D.model.relsOf(id).forEach(function (r) { linked[r.other] = 1; });
  var t = kindOf(id) === 'T' ? D.model.item(id) : null;
  if (t) depList(t).forEach(function (x) { linked[x] = 1; });
  var c = [];
  function addItem(x, done) { if (x.id !== id && !linked[x.id] && (!blocked || !D.model.dependsOn(x.id, id))) c.push({ id: x.id, label: x.title, kind: TYPE_NAME[x.meta.type] || TYPE_NAME.task, done: done, at: String((done ? x.meta['done-date'] : receivedOf(x.meta)) || ''), hay: x.id + ' ' + x.title }); }
  D.model.openList().concat(S.m.inbox.items).forEach(function (x) { addItem(x, false); });
  if (!blocked && o.done) S.m.done.items.forEach(function (x) { addItem(x, true); });
  if (!blocked) {
    D.model.activePeople().forEach(function (p) { if (p.meta.id && !linked[p.meta.id]) c.push({ id: p.meta.id, label: p.name, kind: 'Person', at: '', hay: p.meta.id + ' ' + p.name + ' ' + (p.meta.title || '') }); });
    D.model.entsOf('PRJ').concat(D.model.entsOf('SYS')).forEach(function (x) { if (x.meta.id && !linked[x.meta.id]) c.push({ id: x.meta.id, label: x.name, kind: D.model.KIND_WORD[kindOf(x.meta.id)], at: '', hay: x.meta.id + ' ' + x.name }); });
  }
  var words = q.split(/\s+/);
  c = c.filter(function (x) {
    return x.id !== id && (blocked || !relLine(id, x.id).err) && (kind === 'All' || x.kind === kind) &&
      words.every(function (w) { return x.hay.toLowerCase().indexOf(w) >= 0; });
  });
  function rank(x) { return x.id.toLowerCase() === q ? 0 : (x.label.toLowerCase().indexOf(q) === 0 ? 1 : 2); }
  function num(x) { return parseInt(x.id.split('-')[1], 10) || 0; }
  c.sort(function (a, b) { return rank(a) - rank(b) || (!!a.done - !!b.done) || (a.at < b.at ? 1 : a.at > b.at ? -1 : 0) || num(b) - num(a); });
  return { list: c.slice(0, LINK_MAX), more: Math.max(0, c.length - LINK_MAX) };
}
function vPicks(res, act, none) {

  return '<div class="picks" data-k="picks">' + res.list.map(function (x) {
    return '<button type="button" class="pick" data-act="' + act + '" data-v="' + x.id + '"><span class="kind hint">' + esc(x.kind) + '</span><span style="flex:1;min-width:0">' + esc(x.label) + '</span>' + (x.done ? badge('Done', 'ok') : '') + '<span class="id">' + x.id + '</span></button>';
  }).join('') + '</div>' + (res.more ? '<div class="hint">' + res.more + ' more, refine your search.</div>' : '');
}
// the Items that can merge with id (not itself, never a Meeting), matching every word of q in their ID or title -> {list, more} or null

    if (canMerge(me, x) && words.every(function (v) { return hay.indexOf(v) >= 0; })) c.push({ id: x.id, label: x.title, kind: w === 'inbox' ? 'Proposal' : D.model.TYPE_WORD[x.meta.type || 'task'] || x.meta.type, done: w === 'done', at: String((w === 'done' ? x.meta['done-date'] : receivedOf(x.meta)) || '') });
  });
  function rank(x) { return x.id.toLowerCase() === q ? 0 : (x.label.toLowerCase().indexOf(q) === 0 ? 1 : 2); }
  c.sort(function (a, b) { return rank(a) - rank(b) || (!!a.done - !!b.done) || (a.at < b.at ? 1 : a.at > b.at ? -1 : 0) || D.model.idNum(b.id) - D.model.idNum(a.id); });

}

/* ===================== folder access and start-up ===================== */
async function loadFolderSugs() {
  try { var sugs = await D.files.folderSuggestions(); if (sugs) { S.folderSugs = sugs; render(); } } catch (e) { /* no suggestions */ }
}
async function pickFolder() {
  var h;
  try { h = await window.showDirectoryPicker({ id: 'discerny', mode: 'readwrite' }); }
  catch (e) { if (e && e.name === 'AbortError') return; S.gate = { mode: 'error', msg: D.files.errText(e) }; render(); return; }
  D.files.useFolder(h); S.folder = h.name;
  try { await h.getFileHandle('TASKS.md'); }
  catch (e) { if (e && e.name === 'NotFoundError') { S.gate = { mode: 'wrong', msg: '“' + h.name + '” has no TASKS.md.' }; render(); return; } }
  await D.files.idbSet('dir', h);
  openFolder();
}
// Switching data folders reloads the page, so nothing from the old folder (undo, selection, timestamps) carries over.
async function changeFolder() {
  if (D.files.srv) {
    if (S.dialog !== 'folder') { S.dlgReturn = document.activeElement; S.folderPath = ''; S.folderErr = ''; }
    S.dialog = 'folder'; render();
    if (D.files.srv.canSwitch) { loadFolderSugs(); focusLater('#folder-path'); } else focusLater('.dlg .xbtn');
    return;
  }
  if (D.files.Q.jobs.some(function (j) { return !j.sync; })) { D.ops.toastShow('Wait until your changes are saved, then change folder.'); return; }
  var h;
  try { h = await window.showDirectoryPicker({ id: 'discerny', mode: 'readwrite' }); }
  catch (e) { if (!e || e.name !== 'AbortError') D.ops.toastShow('Couldn’t open the folder: ' + D.files.errText(e)); return; }
  try { await h.getFileHandle('TASKS.md'); }
  catch (e) { D.ops.toastShow('“' + h.name + '” has no TASKS.md, so it isn’t a Discerny data folder.'); return; }
  if (!(await D.files.idbSet('dir', h))) { D.ops.toastShow('Couldn’t remember the new folder.'); return; }
  location.reload();
}
async function regrant() {
  if (!D.files.dir) { pickFolder(); return; }
  try {
    var p = await D.files.dir.requestPermission({ mode: 'readwrite' });
    if (p === 'granted') { openFolder(); return; }
    S.gate = { mode: 'denied', msg: '' };
  } catch (e) { S.gate = { mode: 'error', msg: D.files.errText(e) }; }
  render();
}
async function openFolder() {
  if (D.files.srv && D.files.srv.problem === 'none') { S.gate = { mode: 'nofolder', msg: '' }; render(); loadFolderSugs(); focusLater('#folder-path'); return; }
  if (D.files.srv && D.files.srv.canSwitch) loadFolderSugs();
  S.folder = D.files.srv ? D.files.srv.name : D.files.dir.name;
  if (!D.files.srv) try { await D.files.dir.getFileHandle('TASKS.md'); }
  catch (e) {
    if (e && e.name === 'NotFoundError') S.gate = { mode: 'wrong', msg: '“' + D.files.dir.name + '” has no TASKS.md.' };
    else if (D.files.isPermErr(e)) S.gate = { mode: D.files.srv ? 'srvdown' : 'reconnect', msg: '' };
    else S.gate = { mode: 'error', msg: D.files.errText(e) };
    render();
    return;
  }
  S.gate = { mode: 'loading', msg: '' };
  render();
  try {
    var g = await D.files.formatGate();
    if (g) { S.gate = g; render(); return; }
    D.model.setSettings(readSettings(await D.files.readText(SETTINGS_FILE)));
    var m = await D.ops.loadAll(); D.ops.applyLoaded(m); S.lastSync = Date.now();
  }
  catch (e) {
    console.error(e);
    // The server switched folders between /api/info and these reads: open the folder it serves now.
    if (D.files.isMoved(e)) { location.reload(); return; }
    S.gate = D.files.isPermErr(e) ? { mode: D.files.srv ? 'srvdown' : 'reconnect', msg: '' } : { mode: 'error', msg: D.files.errText(e) }; render(); return;
  }
  S.ready = true;
  land();
  startTimers();
  focusLater('#page-title');
  if (D.files.Q.jobs.length) D.files.kick();
}
var timersOn = false, lastDay = '';
function startTimers() {
  if (timersOn) return;
  timersOn = true;
  lastDay = D.model.todayStr();
  setInterval(poll, 3000);
  setInterval(function () { if (!document.hidden) render(); if (D.model.todayStr() !== lastDay) { lastDay = D.model.todayStr(); render(); } }, 30000);
  window.addEventListener('focus', function () { poll(); render(); });
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { poll(); render(); } });
}
async function boot() {
  measure();
  if (S.theme === 'light' || S.theme === 'dark') document.documentElement.setAttribute('data-theme', S.theme);
  document.addEventListener('click', function (ev) {
    var el = ev.target && ev.target.closest ? ev.target.closest('[data-act]') : null;
    if (!el || el.disabled) return;
    var a = el.getAttribute('data-act');
    if (a === 'dlg-bg' && ev.target !== el) return;
    if (ACT[a]) ACT[a](el, ev);
  });
  document.addEventListener('change', function (ev) { var el = ev.target, k = el && el.getAttribute ? el.getAttribute('data-ch') : null; if (k && CH[k]) CH[k](el, ev); });
  document.addEventListener('input', function (ev) { var el = ev.target, k = el && el.getAttribute ? el.getAttribute('data-in') : null; if (k && IN[k]) IN[k](el, ev); });
  document.addEventListener('submit', function (ev) { var f = ev.target, k = f.getAttribute('data-sub'); if (k && SUB[k]) { ev.preventDefault(); SUB[k](f, ev); } });
  document.addEventListener('keydown', onKey);
  document.addEventListener('scroll', function (ev) {
    var m = ev.target;
    if (!m || m.id !== 'main') return;
    var s = m.scrollTop > 4;
    if (s !== S.scrolled) { S.scrolled = s; var h = m.querySelector('.head'); if (h) h.classList.toggle('scrolled', s); }
  }, true);
  window.addEventListener('resize', function () { measure(); render(); });
  // Back, Forward, an edited address or a bookmark; before the folder is read, openFolder lands on the Link instead
  window.addEventListener('hashchange', function () { if (S.ready && S.m && location.hash !== hashOwn) land(); });
  window.addEventListener('beforeunload', function (ev) { if (D.files.Q.jobs.some(function (j) { return !j.sync; })) { ev.preventDefault(); ev.returnValue = ''; } });
  // Served by node tools/discern.mjs serve: the server reads and writes the folder, so no picker or permission.
  if (location.protocol === 'http:' && (await D.files.serverInfo())) { openFolder(); return; }
  if (!('showDirectoryPicker' in window)) { S.gate = { mode: 'nosupport', msg: '' }; render(); return; }
  var h = await D.files.idbGet('dir');
  if (h && h.kind === 'directory') {
    D.files.useFolder(h); S.folder = h.name;
    var p = 'prompt';
    try { p = await h.queryPermission({ mode: 'readwrite' }); } catch (e) { /* treat as prompt */ }
    if (p === 'granted') { openFolder(); return; }
    S.gate = { mode: 'reconnect', msg: '' };
    render();
    return;
  }
  S.gate = { mode: 'pick', msg: '' };
  render();
}
// What files and ops set off, handled here until render has moved.
D.files.install('redraw', function () { render(); });
boot();
</script>
